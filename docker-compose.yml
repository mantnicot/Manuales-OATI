services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oati
      POSTGRES_PASSWORD: oati
      POSTGRES_DB: oati_manuales
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://oati:oati@postgres:5432/oati_manuales
      SYNC_DATABASE_URL: postgresql+psycopg://oati:oati@postgres:5432/oati_manuales
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:4200
      JWT_SECRET: change-me
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio12345
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - minio

volumes:
  pgdata: {}
  minio: {}
